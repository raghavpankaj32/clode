<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>



        <!-- Heading Box -->
        <div class="heading-box">
            <h1>Lushmeup - Makup Brand</h1>
        </div>
        <br>
    <!-- Back Button -->
    <button class="back-button" onclick="goBack()">← Back</button>

    <div class="container">
        <!-- Image Item -->
        <div class="gallery-item">
            <img src="image/lushmeup/Primary-logo.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Logo</div>
        </div>
        <div class="gallery-item">
            <img src="image/lushmeup/Packing.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Packing</div>
        </div>
        <div class="gallery-item">
            <img src="image/lushmeup/Brand-Pattern.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Pattern</div>
        </div>
        <div class="gallery-item">
            <img src="image/lushmeup/Mood-board.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Mood Board</div>
        </div>
        <div class="gallery-item">
            <img src="image/lushmeup/Secondary-Logo.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Secondary Logo</div>
        </div>
        <div class="gallery-item">
            <img src="image/lushmeup/Makup-Poster-(Advertisement).png" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Poster</div>
        </div>
        <div class="gallery-item">
            <img src="image/lushmeup/rate-list.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Price List</div>
        </div>
        <!-- Video Item 
        <div class="gallery-item">
            <video src="design/videoplayback.mp4" alt="Design Video 1" onclick="openMedia(this)">
                Your browser does not support the video tag.
            </video>
            <div class="alt-text">Design Video 1</div>
        </div>
        -->


        <!-- Add more items as needed -->
    </div>

    <!-- Modal for displaying media -->
    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" class="modal-item" src="" alt="">
            <video id="modalVideo" class="modal-item" controls>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
