<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>



        <!-- Heading Box -->
        <div class="heading-box">
            <h1>Gmight - facewash and handwash company</h1>
        </div>
        <br>
    <!-- Back Button -->
    <button class="back-button" onclick="goBack()">← Back</button>

    <div class="container">
        <!-- Image Item -->
        <div class="gallery-item">
            <img src="image/gmight/Branding---Gmight Logo.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Logo</div>
        </div>
        <div class="gallery-item">
            <img src="image/gmight/Poster.png" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Poster-2</div>
        </div>
        <div class="gallery-item">
            <img src="image/gmight/G-might-Packing.gif" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Colour</div>
        </div>
        <div class="gallery-item">
            <img src="image/gmight/gmight-poster-1.png" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Poster</div>
        </div>
        <div class="gallery-item">
            <img src="image/gmight/Branding---Gmight- Colour.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Packing</div>
        </div>
        <!-- Video Item 



        <div class="gallery-item">
            <video src="design/videoplayback.mp4" alt="Design Video 1" onclick="openMedia(this)">
                Your browser does not support the video tag.
            </video>
            <div class="alt-text">Design Video 1</div>
        </div>

        -->

    </div>

    <!-- Modal for displaying media -->
    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" class="modal-item" src="" alt="">
            <video id="modalVideo" class="modal-item" controls>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
