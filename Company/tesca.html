<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>



        <!-- Heading Box -->
        <div class="heading-box">
            <h1>Tesa Lighting - Led Lighting Company</h1>
        </div>
        <br>
    <!-- Back Button -->
    <button class="back-button" onclick="goBack()">← Back</button>

    <div class="container">
        <!-- Image Item -->
        <div class="gallery-item">
            <img src="image/tesca/Tesca-Logo.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Logo</div>
        </div>
        <div class="gallery-item">
            <img src="image/tesca/Packing.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Packing</div>
        </div>
        <div class="gallery-item">
            <img src="image/tesca/tesca-Color.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Color</div>
        </div>
        <div class="gallery-item">
            <img src="image/tesca/Adjustable panel Box.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Box</div>
        </div>
        <div class="gallery-item">
            <pdf src="image/tesca/Tesca Catalouge 2024.pdf" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Color</div>
        </div>


        <!-- Video Item 

        <div><h2>Video Title</h2></div>
        <div class="gallery-item">
            <video src="design/videoplayback.mp4" alt="Design Video 1" onclick="openMedia(this)">
                Your browser does not support the video tag.
            </video>
            <div class="alt-text">Design Video 1</div>
        </div>
-->
        <!-- Another Image Item -->

        <!-- Another Video Item -->
        <div class="gallery-item">
            <video src="video2.mp4" alt="Design Video 2" onclick="openMedia(this)">
                Your browser does not support the video tag.
            </video>
            <div class="alt-text">Design Video 2</div>
        </div>

        <!-- Add more items as needed -->
    </div>

    <!-- Modal for displaying media -->
    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" class="modal-item" src="" alt="">
            <video id="modalVideo" class="modal-item" controls>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
