<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>



        <!-- Heading Box -->
        <div class="heading-box">
            <h1>Beroot - Digital marketing Agency</h1>
        </div>
        <br>
    <!-- Back Button -->
    <button class="back-button" onclick="goBack()">← Back</button>

    <div class="container">
        <!-- Image Item -->
        <div class="gallery-item">
            <img src="image/beroot/Logo-beroot.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Logo</div>
        </div>
        <div class="gallery-item">
            <img src="image/beroot/Visiting-car.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Visiting Card</div>
        </div>
                <div class="gallery-item">
            <img src="image/beroot/Visiting-card-1.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Visiting Card</div>
        </div>
        <div class="gallery-item">
            <img src="image/beroot/Brand--Pattern.jpg" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Pattern</div>
        </div>
        <div class="gallery-item">
            <img src="image/beroot/Beroot--Banner.png" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Banner</div>
        </div>
        <div class="gallery-item">
            <img src="image/beroot/Beroot-1.png" alt="Design 1" onclick="openMedia(this)">
            <div class="alt-text">Poster</div>
        </div>
        <div class="gallery-item">
            <img src="image/beroot/Beroot-3.png" alt="Design 1" onclick="openMedia(this)">

        </div>
        <div class="gallery-item">

            <div class="alt-text">Poster</div>
        </div>
        <div class="gallery-item">

            <div class="alt-text">Poster</div>

        <!-- Video Item 
        <div class="gallery-item">
            <video src="design/videoplayback.mp4" alt="Design Video 1" onclick="openMedia(this)">
                Your browser does not support the video tag.
            </video>
            <div class="alt-text">Design Video 1</div>
        </div>
-->
        <!-- Add more items as needed -->
    </div>

    <!-- Modal for displaying media -->
    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" class="modal-item" src="" alt="">
            <video id="modalVideo" class="modal-item" controls>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
